allprojects {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url "https://android-sdk.is.com/" }
        maven { url "https://artifact.bytedance.com/repository/pangle" }
        maven { url "https://sdk.tapjoy.com/" }

        maven {
            url "https://artifactory.bidmachine.io/bidmachine"
            content {
                includeGroupByRegex("io\\.bidmachine.*")
                includeGroup("com.explorestack")
            }
        }
        maven { url "https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea" }
        maven { url "https://cboost.jfrog.io/artifactory/chartboost-ads/" }
        maven { url "https://dl.appnext.com/" }
        maven { url "https://developer.huawei.com/repo/" }
    }
}

def pinnedKotlinStdlib = '2.1.0'

allprojects {
    configurations.matching { !it.name.startsWith('kotlin') }.configureEach {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:$pinnedKotlinStdlib"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:$pinnedKotlinStdlib"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$pinnedKotlinStdlib"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$pinnedKotlinStdlib"
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
